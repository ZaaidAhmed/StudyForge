spring.datasource.url=jdbc:h2:mem:coursepilot-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
coursepilot.storage.upload-dir=target/test-uploads
coursepilot.storage.max-file-size=10485760
coursepilot.retrieval.chunk-size=1200
coursepilot.retrieval.chunk-overlap=150
coursepilot.retrieval.default-top-k=5
coursepilot.retrieval.max-top-k=20
coursepilot.retrieval.minimum-score=1.0
coursepilot.retrieval.exact-phrase-weight=6.0
coursepilot.retrieval.term-coverage-weight=4.0
coursepilot.retrieval.term-weight=1.5
coursepilot.retrieval.term-frequency-weight=0.25
coursepilot.retrieval.title-weight=2.0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
