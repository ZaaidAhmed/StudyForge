<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Agent assistance')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content learning-content"><a class="back-link" th:href="@{/courses/{id}(id=${course.id})}">Back to course</a><p class="eyebrow" th:text="${course.courseCode}">EECS3311</p><h1>CoursePilot agent</h1><p class="lede">Ask for multi-step learning help. The agent uses bounded, course-scoped tools and shows observable results.</p><form class="card" method="post" th:action="@{/courses/{id}/agent(id=${course.id})}"><label for="request">What would you like to do?</label><textarea id="request" name="request" maxlength="1000" required th:text="${request}" placeholder="Help me study what I am weakest at"></textarea><button class="button primary" type="submit">Run study task</button><p class="alert error" th:if="${agentError}" th:text="${agentError}"></p></form><section class="card" th:if="${agentResult}"><h2>Agent result</h2><pre class="agent-result" th:text="${agentResult}">Result</pre></section></main></body></html>
