<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Concepts')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content"><a class="back-link" th:href="@{/courses/{id}(id=${course.id})}">Back to course</a><p class="eyebrow" th:text="${course.courseCode}">EECS3311</p><h1>Concepts</h1><p class="lede">Choose a ready document to extract a source-linked concept list.</p><section class="panel"><div th:if="${#lists.isEmpty(materials)}" class="empty-state"><h2>No materials yet</h2><p>Upload material before extracting concepts.</p></div><div th:unless="${#lists.isEmpty(materials)}" class="material-grid"><article class="material-card" th:each="material : ${materials}"><h2 th:text="${material.originalFilename}">document.pdf</h2><p class="muted" th:text="${material.processingStatus}">READY</p><a class="button secondary" th:if="${material.processingStatus == 'READY'}" th:href="@{/courses/{courseId}/materials/{id}/concepts(courseId=${course.id},id=${material.id})}">Open concepts</a><span class="muted" th:unless="${material.processingStatus == 'READY'}">Not ready yet</span></article></div></section></main></body></html>
