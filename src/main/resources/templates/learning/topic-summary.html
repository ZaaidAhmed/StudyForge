<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Topic summary')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content learning-content"><a class="back-link" th:href="@{/courses/{id}/materials(id=${course.id})}">Back to materials</a><p class="eyebrow" th:text="${course.courseCode}">EECS3311</p><h1>Summarize a topic</h1><p class="lede">Searches this course first, then summarizes only the relevant ready material.</p><section class="panel insight-panel"><form method="post" th:action="@{/courses/{id}/summary/topic(id=${course.id})}"><label for="topic">Topic</label><input id="topic" name="topic" type="text" maxlength="200" required th:value="${topic}" placeholder="e.g. SOLID principles"><button class="button primary" type="submit">Summarize topic</button></form><div th:if="${insightError}" class="alert error" role="alert" th:text="${insightError}"></div><div th:if="${summary}" class="topic-result"><h2 th:text="${summary.label}">Topic</h2><p th:text="${summary.summary}">Summary</p><h3>Key points</h3><ul><li th:each="point : ${summary.keyPoints}" th:text="${point}">Key point</li></ul><h3>Sources</h3><ol><li th:each="source : ${summary.sources}" th:text="${source.sourceId + ' · ' + source.documentName + ' · ' + source.snippet}">S1</li></ol></div></section></main></body></html>
