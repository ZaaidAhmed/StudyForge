<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('History')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content learning-content"><a class="back-link" th:href="@{/courses/{id}(id=${course.id})}">Back to course</a><p class="eyebrow" th:text="${course.courseCode}">EECS3311</p><h1>Learning history</h1><p class="lede">A chronological record of your course learning activity.</p><section class="card"><p th:if="${#lists.isEmpty(history)}">No learning history yet. Review flashcards, take a quiz, or create a study plan.</p><div class="list" th:each="event : ${history}"><div><strong th:text="${event.type}">QUIZ_ATTEMPT</strong><p th:text="${event.title}">Quiz completed</p></div><p class="muted"><span th:text="${event.occurredAt}">time</span> · <span th:text="${event.detail}">detail</span></p></div></section></main></body></html>
