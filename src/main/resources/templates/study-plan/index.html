<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Study Plan')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content learning-content"><a class="back-link" th:href="@{/courses/{id}(id=${course.id})}">Back to course</a><p class="eyebrow" th:text="${course.courseCode}">EECS3311</p><h1>Study Plan</h1><p class="lede">Build a practical schedule from your learning activity. Scheduling constraints are enforced deterministically.</p><div class="card"><h2>Create a plan</h2><form method="post" th:action="@{/courses/{id}/study-plan(id=${course.id})}"><label>Start date<input type="date" name="startDate" required></label><label>Target date<input type="date" name="targetDate" required></label><label>Available minutes total<input type="number" name="minutes" min="1" required value="120"></label><label>Strategy<select name="strategy"><option value="BALANCED">Balanced</option><option value="WEAK_TOPIC_FOCUSED">Weak-topic focused</option><option value="EXAM_CRAM">Exam cram</option></select></label><button class="button primary" type="submit">Create study plan</button></form><p class="alert success" th:if="${planMessage}" th:text="${planMessage}"></p><p class="alert error" th:if="${planError}" th:text="${planError}"></p></div><section class="card"><h2>Saved plans</h2><p th:if="${#lists.isEmpty(plans)}">No study plan yet. Create one after reviewing flashcards or taking a quiz.</p><article class="list" th:each="plan : ${plans}"><div><strong th:text="${plan.strategy}">BALANCED</strong><p class="muted" th:text="${plan.startDate + ' to ' + plan.targetDate + ' · ' + plan.availableMinutes + ' minutes'}">Dates</p></div><ul><li th:each="item : ${plan.items}" th:text="${item.date + ' · ' + item.activity + ' (' + item.minutes + ' min)'}">Activity</li></ul></article></section></main></body></html>
