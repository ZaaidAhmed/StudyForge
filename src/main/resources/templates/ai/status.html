<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AI status')}"></head>
<body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside>
<main class="content narrow"><a class="back-link" th:href="@{/courses}">Back to courses</a><div class="page-heading"><div><p class="eyebrow">System check</p><h1>AI answering status</h1><p class="lede">StudyForge's deterministic course tools remain available even when AI answering is offline.</p></div></div><section class="panel"><div class="status-line"><span class="status-dot" th:classappend="${availability.available ? '' : ' error'}"></span><strong th:text="${availability.status}">AVAILABLE</strong></div><dl class="metadata-grid"><div><dt>Provider</dt><dd th:text="${availability.provider}">ollama</dd></div><div><dt>Model</dt><dd th:text="${availability.model}">qwen2.5-coder:14b</dd></div><div><dt>Message</dt><dd th:text="${availability.message}">Ollama is reachable.</dd></div></dl><div class="state-actions"><a class="button primary" th:href="@{/courses}">Choose a course</a><a class="button secondary" th:href="@{/ai/status}">Check again</a></div></section></main></body></html>
