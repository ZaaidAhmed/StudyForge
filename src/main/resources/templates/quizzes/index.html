<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quizzes')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content learning-content"><section>
<a th:href="@{/courses/{id}(id=${course.id})}">Back to course</a><p class="eyebrow">COURSE WORKSPACE</p><h1>Quizzes</h1><p class="lede">Generate a grounded practice quiz from ready material in <strong th:text="${course.name}">this course</strong>.</p>
<div class="card action-card"><h2>Generate a quiz</h2><p>Questions are created only from the selected uploaded document.</p><form method="post" th:action="@{/courses/{id}/quizzes/generate(id=${course.id})}"><label>Material<select name="documentId" required><option th:each="m : ${materials}" th:if="${m.processingStatus() == 'READY'}" th:value="${m.id()}" th:text="${m.originalFilename()}">document</option></select></label><label>Questions<select name="count"><option>5</option><option selected="selected">10</option><option>15</option></select></label><button class="button primary" type="submit">Generate quiz</button></form><p class="error" th:if="${quizError}" th:text="${quizError}"></p></div>
<div class="card"><h2>Saved quizzes</h2><p th:if="${#lists.isEmpty(quizzes)}">No quizzes yet. Upload a ready document, then generate one above.</p><div class="list" th:each="quiz : ${quizzes}"><a th:href="@{/courses/{c}/quizzes/{q}(c=${course.id},q=${quiz.id})}" th:text="${quiz.title}">Quiz</a><span th:text="${#lists.size(quiz.questions()) + ' questions'}">0 questions</span></div></div>
</section></main></body></html>
