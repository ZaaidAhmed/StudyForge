<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Take quiz')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content learning-content"><section>
<a th:href="@{/courses/{id}/quizzes(id=${course.id})}">Back to quizzes</a><p class="eyebrow">PRACTICE QUIZ</p><h1 th:text="${quiz.title}">Quiz</h1><div class="card" th:if="${attempt}"><h2 th:text="${'Score: ' + attempt.correctCount() + ' / ' + attempt.totalCount()}">Score</h2><p>Review the grounded material for any missed answers.</p><div class="answer-result" th:each="answer : ${attempt.answers}"><strong th:text="${answer.correct() ? 'Correct' : 'Needs review'}">Result</strong><p th:text="${answer.feedback()}">Feedback</p><form th:if="${!answer.correct()}" method="post" th:action="@{/courses/{c}/quizzes/{q}/questions/{id}/explain(c=${course.id},q=${quiz.id},id=${answer.questionId})}"><input type="hidden" name="answer" th:value="${answer.answer()}"/><button class="button ghost" type="submit">Explain this answer</button></form></div></div><div class="card alert" th:if="${explanation}" role="status"><h2>Grounded explanation</h2><p th:text="${explanation.explanation()}">Explanation</p><p th:if="${explanation.unavailable}" class="muted">Try again when AI is available.</p><ul><li th:each="source : ${explanation.sources}" th:text="${source.sourceId() + ' · ' + source.documentName() + ' · ' + source.snippet()}">Source</li></ul></div><form class="card quiz-form" method="post" th:action="@{/courses/{c}/quizzes/{q}/submit(c=${course.id},q=${quiz.id})}"><fieldset th:each="question,stat : ${quiz.questions()}"><legend th:text="${(stat.index + 1) + '. ' + question.prompt()}">Question</legend><div th:if="${question.type().name() != 'SHORT_ANSWER'}"><label class="choice" th:each="option : ${question.options()}"><input type="radio" th:name="${'q-' + question.id()}" th:value="${option}"/><span th:text="${option}">Option</span></label></div><textarea th:if="${question.type().name() == 'SHORT_ANSWER'}" th:name="${'q-' + question.id()}" rows="3" placeholder="Write your answer"></textarea></fieldset><button class="button primary" type="submit">Submit answers</button></form>
</section></main></body></html>
