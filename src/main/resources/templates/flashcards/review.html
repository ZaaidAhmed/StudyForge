<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Review flashcards')}"></head><body><header th:replace="~{fragments/layout :: topbar}"></header><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="content learning-content"><a class="back-link" th:href="@{/courses/{id}/flashcards(id=${course.id})}">Back to flashcards</a><p class="eyebrow" th:text="${course.courseCode}">EECS3311</p><h1>Review flashcards</h1><div th:if="${reviewMessage}" class="alert success" role="status" th:text="${reviewMessage}"></div><div th:if="${flashcardError}" class="alert error" role="alert" th:text="${flashcardError}"></div><div th:if="${#lists.isEmpty(flashcards)}" class="empty-state"><h2>No flashcards to review</h2><p>Generate a deck from ready course material first.</p><a class="button primary" th:href="@{/courses/{id}/flashcards(id=${course.id})}">Generate flashcards</a></div><section th:unless="${#lists.isEmpty(flashcards)}" class="review-list"><article class="panel review-card" th:each="card, stat : ${flashcards}"><p class="eyebrow" th:text="'Card ' + ${stat.count} + ' of ' + ${flashcards.size()}">Card 1 of 10</p><h2>Question</h2><p class="review-question" th:text="${card.question}">Question</p><button class="button secondary reveal-button" type="button">Reveal answer</button><div class="revealed-answer" hidden><h2>Answer</h2><p th:text="${card.answer}">Answer</p><p class="muted" th:each="source : ${card.sources}" th:text="${source.documentName + ' · ' + (source.pageStart != null ? 'Page ' + source.pageStart : 'Chunk ' + source.chunkIndex)}">Source</p><h3>Rate this card</h3><form class="rating-actions" method="post" th:action="@{/courses/{courseId}/flashcards/{cardId}/review(courseId=${course.id},cardId=${card.id})}"><button class="button rating" name="rating" value="INCORRECT" type="submit">Incorrect</button><button class="button rating" name="rating" value="HARD" type="submit">Hard</button><button class="button rating" name="rating" value="GOOD" type="submit">Good</button><button class="button rating" name="rating" value="EASY" type="submit">Easy</button></form></div></article></section></main><script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.reveal-button').forEach(function(b){b.addEventListener('click',function(){const a=b.parentElement.querySelector('.revealed-answer');a.hidden=false;b.hidden=true;});});});</script></body></html>
