spring.application.name=studyforge-ai
spring.datasource.url=jdbc:h2:file:./data/coursepilot;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.port=8080
logging.level.ca.yorku.eecs3311.coursepilot=INFO
coursepilot.storage.upload-dir=./data/uploads
coursepilot.storage.max-file-size=10485760
coursepilot.retrieval.chunk-size=1200
coursepilot.retrieval.chunk-overlap=150
coursepilot.retrieval.default-top-k=5
coursepilot.retrieval.max-top-k=20
coursepilot.retrieval.minimum-score=1.0
coursepilot.ai.enabled=true
coursepilot.ai.provider=ollama
coursepilot.ai.base-url=http://localhost:11434
coursepilot.ai.model=qwen2.5-coder:14b
coursepilot.ai.connect-timeout=2s
# Local models may need extra time to generate a grounded multi-card response.
coursepilot.ai.request-timeout=180s
coursepilot.qa.retrieval-top-k=5
coursepilot.qa.max-question-length=1000
coursepilot.qa.max-context-characters=12000
coursepilot.retrieval.exact-phrase-weight=6.0
coursepilot.retrieval.term-coverage-weight=4.0
coursepilot.retrieval.term-weight=1.5
coursepilot.retrieval.term-frequency-weight=0.25
coursepilot.retrieval.title-weight=2.0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
